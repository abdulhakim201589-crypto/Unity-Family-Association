<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট সমিতি ম্যানেজমেন্ট পোর্টাল</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Bengali Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Html2Pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .tab-btn.active {
            background-color: #3730a3;
            color: white;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-white text-indigo-900 font-bold flex items-center justify-center text-xl shadow" id="logoDisplay">
                    ঐ
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide" id="associationTitle">ঐক্য পরিবার সমিতি</h1>
                    <p class="text-xs text-indigo-200">লাইভ সদস্য, হিসাব ও নোটিশ বোর্ড</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="adminBadge" class="bg-amber-500 text-slate-900 text-xs font-bold px-3 py-1 rounded-full hidden">এডমিন অ্যাক্টিভ</span>
                <button id="authBtn" onclick="toggleAuth()" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-semibold text-sm px-4 py-1.5 rounded-lg transition shadow">
                    এডমিন লগইন
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">

        <!-- Sidebar Navigation -->
        <div class="md:col-span-1 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 h-fit space-y-2">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">প্রধান মেনু</h2>
            
            <button onclick="switchTab('tab-notice')" id="btn-tab-notice" class="tab-btn active w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 transition hover:bg-indigo-50">
                <i class="fa-solid fa-bullhorn w-5 text-center"></i> নোটিশ ও নিউজ
            </button>
            
            <button onclick="switchTab('tab-members')" id="btn-tab-members" class="tab-btn w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 transition hover:bg-indigo-50">
                <i class="fa-solid fa-users w-5 text-center"></i> সদস্য তালিকা
            </button>

            <div id="adminMenuSection" class="pt-4 border-t border-slate-100 hidden">
                <h2 class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2 px-2">এডমিন প্যানেল</h2>
                <button onclick="switchTab('tab-settings')" id="btn-tab-settings" class="tab-btn w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 transition hover:bg-indigo-50">
                    <i class="fa-solid fa-gear w-5 text-center"></i> সমিতি সেটিং
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="md:col-span-3 space-y-6">

            <!-- TAB 1: Notice Board -->
            <div id="tab-notice" class="tab-content space-y-6">
                <!-- Admin Add Notice -->
                <div id="addNoticeBox" class="bg-amber-50 rounded-2xl p-5 border border-amber-200 hidden">
                    <h3 class="font-bold text-amber-900 mb-3 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> নতুন নোটিশ প্রকাশ করুন
                    </h3>
                    <div class="space-y-3">
                        <input type="text" id="noticeTitle" placeholder="নোটিশের শিরোনাম" class="w-full px-4 py-2 rounded-xl border border-amber-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <textarea id="noticeBody" rows="3" placeholder="বিস্তারিত নোটিশ..." class="w-full px-4 py-2 rounded-xl border border-amber-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                        <button onclick="publishNotice()" class="bg-amber-600 text-white font-semibold text-sm px-5 py-2 rounded-xl hover:bg-amber-700 transition">
                            প্রকাশ করুন
                        </button>
                    </div>
                </div>

                <!-- Notices List -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-lg font-bold text-indigo-950 flex items-center gap-2 border-b pb-3">
                        <i class="fa-solid fa-bell text-amber-500"></i> লাইভ নোটিশ বোর্ড
                    </h2>
                    <div id="noticesContainer" class="space-y-4">
                        <p class="text-slate-400 text-sm text-center py-4">লোডিং হচ্ছে...</p>
                    </div>
                </div>
            </div>

            <!-- TAB 2: Members List -->
            <div id="tab-members" class="tab-content hidden space-y-6">
                <!-- Admin Add Member -->
                <div id="addMemberBox" class="bg-indigo-50 rounded-2xl p-5 border border-indigo-100 hidden">
                    <h3 class="font-bold text-indigo-900 mb-3 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> নতুন সদস্য যোগ করুন
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" id="memName" placeholder="সদস্যের নাম" class="px-4 py-2 rounded-xl border border-indigo-200 text-sm">
                        <input type="text" id="memPhone" placeholder="মোবাইল নম্বর" class="px-4 py-2 rounded-xl border border-indigo-200 text-sm">
                        <input type="text" id="memRole" placeholder="পদবী (যেমন: সদস্য/ক্যাশিয়ার)" class="px-4 py-2 rounded-xl border border-indigo-200 text-sm">
                        <button onclick="addMember()" class="bg-indigo-600 text-white font-semibold text-sm px-5 py-2 rounded-xl hover:bg-indigo-700 transition sm:col-span-2">
                            সংরক্ষণ করুন
                        </button>
                    </div>
                </div>

                <!-- Members Table -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-indigo-950 flex items-center gap-2 border-b pb-3 mb-4">
                        <i class="fa-solid fa-users text-indigo-600"></i> সদস্য তালিকা
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 text-slate-700 uppercase text-xs font-bold">
                                <tr>
                                    <th class="p-3">নাম</th>
                                    <th class="p-3">পদবী</th>
                                    <th class="p-3">মোবাইল</th>
                                    <th class="p-3 text-right admin-only hidden">অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody id="membersTableBody" class="divide-y divide-slate-100">
                                <tr><td colspan="4" class="p-4 text-center text-slate-400">লোডিং হচ্ছে...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 3: Settings -->
            <div id="tab-settings" class="tab-content hidden space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-lg font-bold text-indigo-950 border-b pb-3">সমিতি সেটিং</h2>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">সমিতির নাম</label>
                        <input type="text" id="settingTitleInput" class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <button onclick="updateSettings()" class="bg-indigo-600 text-white font-semibold text-sm px-5 py-2 rounded-xl">
                        সেভ করুন
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. Firebase Config (Live Public Database)
        const firebaseConfig = {
            databaseURL: "https://samity-management-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdmin = false;

        // Admin Auth
        function toggleAuth() {
            if (!isAdmin) {
                let pass = prompt("এডমিন পাসওয়ার্ড দিন (ডিফল্ট: 1234):");
                if (pass === "1234") {
                    isAdmin = true;
                    document.getElementById('adminBadge').classList.remove('hidden');
                    document.getElementById('adminMenuSection').classList.remove('hidden');
                    document.getElementById('addNoticeBox').classList.remove('hidden');
                    document.getElementById('addMemberBox').classList.remove('hidden');
                    document.getElementById('authBtn').innerText = "লগআউট";
                    document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                    renderMembers();
                    renderNotices();
                } else {
                    alert("ভুল পাসওয়ার্ড!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('adminMenuSection').classList.add('hidden');
                document.getElementById('addNoticeBox').classList.add('hidden');
                document.getElementById('addMemberBox').classList.add('hidden');
                document.getElementById('authBtn').innerText = "এডমিন লগইন";
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
                switchTab('tab-notice');
                renderMembers();
                renderNotices();
            }
        }

        // Switch Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        // Live Notice Management
        function publishNotice() {
            let title = document.getElementById('noticeTitle').value;
            let body = document.getElementById('noticeBody').value;
            if (!title || !body) return alert("সব ঘর পূরণ করুন!");

            db.ref('notices').push({
                title: title,
                body: body,
                date: new Date().toLocaleDateString('bn-BD')
            });

            document.getElementById('noticeTitle').value = '';
            document.getElementById('noticeBody').value = '';
        }

        function renderNotices() {
            db.ref('notices').on('value', (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('noticesContainer');
                container.innerHTML = '';

                if (!data) {
                    container.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">কোনো নোটিশ পাওয়া যায়নি।</p>';
                    return;
                }

                Object.keys(data).reverse().forEach(key => {
                    let n = data[key];
                    container.innerHTML += `
                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100 relative">
                            <div class="text-xs text-slate-400 mb-1">${n.date}</div>
                            <h3 class="font-bold text-slate-800 text-base mb-1">${n.title}</h3>
                            <p class="text-sm text-slate-600 leading-relaxed">${n.body}</p>
                            ${isAdmin ? `<button onclick="deleteNotice('${key}')" class="text-red-500 hover:text-red-700 text-xs font-bold absolute top-4 right-4"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    `;
                });
            });
        }

        function deleteNotice(key) {
            if (confirm("নোটিশটি মুছে ফেলতে চান?")) {
                db.ref('notices/' + key).remove();
            }
        }

        // Live Member Management
        function addMember() {
            let name = document.getElementById('memName').value;
            let phone = document.getElementById('memPhone').value;
            let role = document.getElementById('memRole').value || 'সদস্য';

            if (!name) return alert("সদস্যের নাম দিন!");

            db.ref('members').push({ name, phone, role });

            document.getElementById('memName').value = '';
            document.getElementById('memPhone').value = '';
            document.getElementById('memRole').value = '';
        }

        function renderMembers() {
            db.ref('members').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('membersTableBody');
                tbody.innerHTML = '';

                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400">কোনো সদস্য যোগ করা হয়নি।</td></tr>';
                    return;
                }

                Object.keys(data).forEach(key => {
                    let m = data[key];
                    tbody.innerHTML += `
                        <tr>
                            <td class="p-3 font-semibold text-slate-800">${m.name}</td>
                            <td class="p-3"><span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-medium">${m.role}</span></td>
                            <td class="p-3 text-slate-500">${m.phone || 'নেই'}</td>
                            ${isAdmin ? `<td class="p-3 text-right"><button onclick="deleteMember('${key}')" class="text-red-500 hover:text-red-700 text-xs font-bold"><i class="fa-solid fa-trash"></i></button></td>` : ''}
                        </tr>
                    `;
                });
            });
        }

        function deleteMember(key) {
            if (confirm("সদস্যকে তালিকা থেকে সরাতে চান?")) {
                db.ref('members/' + key).remove();
            }
        }

        // Settings
        function updateSettings() {
            let title = document.getElementById('settingTitleInput').value;
            if (title) {
                db.ref('settings/title').set(title);
                alert("সেটিং সেভ হয়েছে!");
            }
        }

        function loadSettings() {
            db.ref('settings/title').on('value', (snapshot) => {
                let val = snapshot.val();
                if (val) {
                    document.getElementById('associationTitle').innerText = val;
                    document.getElementById('logoDisplay').innerText = val.charAt(0);
                }
            });
        }

        // Initial Load
        renderNotices();
        renderMembers();
        loadSettings();
    </script>
</body>
</html>
